name: Read-only prototype visual evidence
on: workflow_dispatch
permissions: {contents: read}
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/setup-node@v4
        with: {node-version: '24.19.0'}
      - run: npm install --no-save --no-audit --no-fund playwright-core@1.63.0
      - run: echo "MM_TEST_CHROMIUM=$(command -v google-chrome || command -v chromium)" >> "$GITHUB_ENV"
      - name: Capture both actual websites with mutation and provider calls blocked
        run: |
          node -e "require('fs').writeFileSync('audit.mjs',Buffer.from('','base64'))"
          node audit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: presentation-prototype-evidence
          path: review-evidence
          retention-days: 7
