name: Verify protected staging binding
on: workflow_dispatch
permissions: {contents: read}
jobs:
  binding:
    environment: matchmind-real-data-preview
    runs-on: ubuntu-latest
    steps:
      - name: Verify binding and derive installation digest
        env:
          MM_STAGING_MIRROR_TOKEN: ${{ secrets.MM_STAGING_MIRROR_TOKEN }}
        shell: python
        run: |
          import os,hashlib
          token=os.environ.get('MM_STAGING_MIRROR_TOKEN','')
          if len(token)<32: raise SystemExit('Protected MM_STAGING_MIRROR_TOKEN missing or too short')
          import json,urllib.request,urllib.error
          url='https://rdcbnvfnxenrpnnwxszs.supabase.co/rest/v1/rpc/mm_preview_publish_v1'
          try:
            urllib.request.urlopen(urllib.request.Request(url,data=b'{"document":{}}',headers={'apikey':'sb_publishable_WKB88h4KAPtLVphsfNF9fg_W90ym80y','Content-Type':'application/json','x-mm-preview-token':token}))
            raise SystemExit('Invalid manifest unexpectedly published')
          except urllib.error.HTTPError as e:
            if json.load(e).get('message')!='Unapproved refresh manifest': raise SystemExit('Staging token authentication failed')
          print('PASS protected token authenticated; invalid manifest refused without publication')
